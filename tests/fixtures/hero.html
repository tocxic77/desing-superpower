<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Fixture — Contrast Failure</title>
    <style>
        :root {
            --bg: #FAFAFA;
            --fg-muted: #737373;
            --fg-primary: #171717;
            --brand: #3B82F6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; line-height: 1.6; }
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            padding: 2rem;
        }
        .hero__content { max-width: 800px; text-align: center; }
        .hero__subtitle {
            font-size: 1.25rem;
            color: #A3A3A3;  /* neutral-400 — FAILS: 2.7:1 on #FAFAFA */
        }
        .hero__title {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            color: var(--fg-primary);
            margin: 1rem 0;
            line-height: 1.1;
        }
        .hero__cta {
            display: inline-block;
            background: var(--brand);
            color: white;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            margin-top: 1.5rem;
        }
        .badge {
            display: inline-block;
            background: #F59E0B;
            color: #171717;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero__content">
            <span class="badge">New</span>
            <h1 class="hero__title">Design Superpowers</h1>
            <p class="hero__subtitle">
                Autonomous design agents that build, validate, and optimize
                conversion-focused deliverables with evidence-based loops.
            </p>
            <a href="#demo" class="hero__cta">See It In Action</a>
        </div>
    </section>
</body>
</html>

[project]
name = "design-superpowers"
version = "0.1.0"
description = "Autonomous agent architecture for design, execution, and commercial optimization"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.25",
    "rich>=13.5",
    "tenacity>=8.2",
    "watchdog>=3.0",
]
# axe-core, lighthouse-ci: paquetes Node — están en package.json

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
    "mypy>=1.6",
    "pre-commit>=3.5",
]
mcp = [
    "mcp>=1.0",
    "fastmcp>=0.1",
]
wordpress = [
    "wordpress-rest-api>=1.0",
]
figma = [
    "figma-api>=0.1",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tools", "tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "T201"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.setuptools.packages.find]
where = ["tools"]
include = ["*"]

[tool.coverage.run]
source = ["tools"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise AssertionError", "raise NotImplementedError"]